[package]
name = "content-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Validates Lumingo curriculum units and catalogs"

[[bin]]
name = "content-cli"
path = "src/main.rs"

[lib]
name = "content_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
# The real W03 checker (harper-core through its `grammar` feature, default on).
# An internal path dependency; harper-core itself is in the register.
assessment-engine = { path = "../../crates/assessment-engine" }
clap = { version = "4.6.7", features = ["derive"] }
curriculum = { path = "../../crates/curriculum" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
