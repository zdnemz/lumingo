name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Generated TypeScript types are up to date
        shell: bash
        run: |
          # The tests above regenerate apps/web/src/generated. A diff or a new
          # file means someone changed a Rust API type without committing it.
          git add --intent-to-add apps/web/src/generated
          git diff --exit-code -- apps/web/src/generated

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licenses
        run: cargo deny check licenses

  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Static export builds
        run: pnpm build

      - name: JavaScript licenses
        run: pnpm run check:licenses
