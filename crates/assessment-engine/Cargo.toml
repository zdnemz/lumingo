[package]
name = "assessment-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Level estimation from stored attempts for Lumingo (est/1)"

[features]
default = ["grammar"]
# Rule-based grammar findings through harper-core: a large dependency tree (see
# docs/LICENSE_REGISTER.md). Crates that only need scoring can turn it off.
grammar = ["dep:harper-core"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
harper-core = { version = "2.11.0", default-features = false, optional = true }

[lints]
workspace = true
