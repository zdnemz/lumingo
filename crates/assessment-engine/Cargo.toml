[package]
name = "assessment-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Scoring, evidence and level estimation for Lumingo"

[features]
default = ["grammar"]
# Rule-based grammar findings through harper-core: a large dependency tree (see
# docs/LICENSE_REGISTER.md). Crates that only need scoring can turn it off.
grammar = ["dep:harper-core"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
harper-core = { version = "=0.68", default-features = false, features = ["concurrent"], optional = true }

[lints]
workspace = true
