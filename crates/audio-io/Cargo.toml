[package]
name = "audio-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Capture, resampling, playback queue, microphone gate, devices and lifecycle for Lumingo"

[dependencies]
speech = { path = "../speech" }
thiserror = "2.0.21"
rtrb = "0.4.0"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"

[features]
# A fake audio backend for tests in other crates and for this crate's integration
# tests. It is never part of a release build.
test-support = []

[dev-dependencies]
# Lets the integration tests in tests/ use the fake backend.
audio-io = { path = ".", features = ["test-support"] }

[lints]
workspace = true
