[package]
name = "model-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model manifest, resumable download, SHA-256 verification and the installed-model record for Lumingo"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
speech = { version = "0.0.0", path = "../speech" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
jsonschema = { version = "0.58.5", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true
