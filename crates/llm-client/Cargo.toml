[package]
name = "llm-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "LLM client for Lumingo: two wire protocols, structured-output ladder, local validation, keys in memory only"

[dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "time"] }
