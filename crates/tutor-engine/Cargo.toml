[package]
name = "tutor-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tutoring logic for Lumingo: session states, UI events, the tutor turn and prompt assembly"

[features]
default = ["grammar"]
# Rule-based grammar and spelling findings for the writing workshop's first
# layer, through `assessment-engine`'s harper-core feature (already in the
# license register). Crates that do not need the workshop can turn it off.
grammar = ["assessment-engine/grammar"]

[dependencies]
assessment-engine = { path = "../assessment-engine", default-features = false }
curriculum = { path = "../curriculum" }
llm-client = { path = "../llm-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
storage = { path = "../storage" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
