# Lumingo model manifest. This is the only source of model download locations.
# The schema is models/manifest.schema.json and is described in models/README.md.
#
# Every entry below is a CANDIDATE. None of them can be downloaded yet:
#
#   * `files` is empty, and a file entry needs a `sha256`. An empty checksum, or no
#     file at all, makes `model-manager verify` and `ModelManager::install` refuse
#     the entry before any network request.
#   * `source` is the upstream project or model page, not yet a directory the
#     files can be fetched from. Replace it, or give each file its own `url`,
#     once the real file locations are known.
#   * `version` and `size_bytes` stay unset until a real download is measured.
#
# The owner fills `files` (path, sha256, size_bytes) after downloading each file
# from the upstream host and checking the checksum and the licence by hand. Do
# not copy a checksum from anywhere but a file you downloaded yourself. Shape of
# a finished file entry:
#
#   files = [
#     { path = "encoder.onnx", sha256 = "<64 hex characters>", size_bytes = 123 },
#   ]
#
# License fields come from docs/LICENSE_REGISTER.md section 6, status `verify`
# unless the notes say otherwise. They are what the register expected, not what
# anyone has read at the source yet.

schema_version = 1

