# License gate for Rust dependencies. The allowlist mirrors rule 2 of
# docs/LICENSE_REGISTER.md. MPL-2.0 and LGPL need a `review` row in the register
# before they may be added here as a per-crate exception. GPL, AGPL and SSPL are
# never allowed.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
# MIT-0 is MIT without the attribution clause: it asks for less than MIT does. It is not on
# the rule 2 list, so it is allowed for the one crate that needs it, with a register row.
# borrow-or-share comes in through jsonschema (referencing, fluent-uri).
exceptions = [
  { crate = "borrow-or-share", allow = ["MIT-0"] },
  # webpki-roots holds the CA root certificate data. It is pulled in only by the
  # build script of sherpa-onnx-sys (through ureq), which downloads the native
  # library, and only when the optional `sherpa` feature of `speech` is on. It is
  # not part of the default build. Register row: docs/LICENSE_REGISTER.md section 3.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
