# License gate for Rust dependencies. The allowlist mirrors rule 2 of
# docs/LICENSE_REGISTER.md. MPL-2.0 and LGPL need a `review` row in the register
# before they may be added here as a per-crate exception. GPL, AGPL and SSPL are
# never allowed.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
# CDLA-Permissive-2.0 is a permissive data license (attribution, no copyleft). It covers
# the Mozilla CA certificate list that reqwest's TLS stack uses. See docs/LICENSE_REGISTER.md.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
